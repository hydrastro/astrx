#  The gate that already exists, run on every push.
#
#   `astrx-suite/install_rust_suite.sh --ci` has always been green — but nothing
#   ran it, and that is how a whole audit's worth of fixes went missing from the
#   remote without anyone noticing. This runs it, plus the two things a laptop
#   cannot check: that the suite builds on the declared MSRV, and that it behaves
#   the same across `git` versions.
#
#   Design notes:
#     * Every job is `--locked`, so a lockfile drift fails the build instead of
#       silently resolving to something new.
#     * The zero-dependency invariant is ASSERTED, not assumed. It is the
#       project's central claim; a claim nothing checks is a claim that decays.
#     * The git matrix exists because a real failure came from it: git renders a
#       zero UTC offset as `+00:00` up to 2.43 and as `Z` after, which changed
#       `gitweb`'s public output under an operator's routine upgrade.
name: astrx-suite

on:
  push:
    paths: ['astrx-suite/**', '.github/workflows/astrx-suite.yml']
  pull_request:
    paths: ['astrx-suite/**', '.github/workflows/astrx-suite.yml']
  # A RUSTSEC advisory can land on a week nobody pushes. Without this the
  # supply-chain check only ever runs when something else already changed.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: astrx-suite

env:
  CARGO_TERM_COLOR: always
  # NB: RUSTFLAGS is deliberately NOT set here. A workflow-level `-D warnings`
  # applies to DEPENDENCY compilation too, so a new warning inside tokio — code
  # this repository does not control and cannot fix — would break the build with
  # no change to the tree. Warnings are denied where they belong: on the clippy
  # invocations below, which are scoped to `--workspace`.

jobs:
  # ---------------------------------------------------------------- style
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  # ------------------------------------------------- lints, every feature tier
  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The four tiers the crates actually ship. A lint clean only under
        # --all-features says nothing about the zero-dependency build, which is
        # the one most people will compile.
        features: ['--no-default-features', '', '--features rand', '--features net', '--all-features']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: astrx-suite }
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }} -- -D warnings

  # ----------------------------------------------------------------- tests
  test:
    name: tests (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['--no-default-features', '--all-features']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: astrx-suite }
      - run: cargo test --workspace --locked ${{ matrix.features }}

  # ------------------------------------------------------ the MSRV is a promise
  msrv:
    name: MSRV 1.80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.0
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: astrx-suite }
      # `astrx-suite/rust-toolchain.toml` pins channel = "stable", and rustup
      # honours that file over whatever toolchain an action selected — so this
      # job used to install 1.80 and then cheerfully build with stable, passing
      # while testing nothing. RUSTUP_TOOLCHAIN takes precedence over the file.
      - name: Prove the toolchain really is the MSRV
        run: rustc --version | tee /dev/stderr | grep -q '1\.80\.'
        env: { RUSTUP_TOOLCHAIN: '1.80.0' }
      # Build, not test: dev-dependencies and test harnesses may legitimately
      # want newer Rust than the shipped library does.
      - run: cargo build --workspace --locked --all-features
        env: { RUSTUP_TOOLCHAIN: '1.80.0' }

  # ------------------------------- the project's central claim, asserted not assumed
  zero-deps:
    name: zero third-party dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The member list is read from the manifest rather than typed out, because
      # a hand-written list silently stops covering a crate the day one is
      # added — and it already had: `astrx`, the entrypoint that depends on all
      # five engines, was missing, so the one crate whose whole job is to pull
      # the others in was the one nobody checked.
      #
      # The filter is anchored to the workspace members too. `grep -v crawlcore`
      # dropped any line CONTAINING that string, so a third-party crate named
      # `crawlcore-anything` would have been waved through; matching the tree's
      # `name v0.0.0` field against the member list cannot be fooled that way.
      - name: Every crate resolves to nothing but first-party code by default
        run: |
          set -euo pipefail
          # Each member's [package] name, straight from its own manifest. Not
          # `cargo metadata | sed`: that JSON has a "name" field on every TARGET
          # and every dependency too, so a naive match yields the 70-odd test
          # binaries as well, and `cargo tree -p xcheck_json` then fails with
          # "did not match any packages" — which the old `|| true` reported as
          # a clean zero.
          members=$(for d in crates/*/; do
            sed -n '/^\[package\]/,/^\[/ s/^name *= *"\([^"]*\)".*/\1/p' "$d/Cargo.toml"
          done | sort -u)
          test -n "$members" || { echo "::error::found no workspace members"; exit 1; }
          echo "workspace members: $(echo "$members" | tr '\n' ' ')"

          fail=0
          for c in $members; do
            # Capture the tree separately so a cargo failure is a failure. The
            # previous version piped straight into `grep -c . || true`, which
            # turned any cargo error into "0 third-party crates" — a gate that
            # reports success precisely when it could not run.
            tree=$(cargo tree -p "$c" --edges normal --locked --prefix none) \
              || { echo "::error::cargo tree failed for $c"; fail=1; continue; }
            # Compare the crate NAME column against the member list, not a
            # substring: `grep -v crawlcore` would also have waved through a
            # third-party crate called `crawlcore-anything`.
            third=$(printf '%s\n' "$tree" | tail -n +2 | awk 'NF {print $1}' | sort -u \
                    | grep -vxF "$members" || true)
            n=$(printf '%s\n' "$third" | grep -c . || true)
            if [ "$n" -ne 0 ]; then
              echo "::error::$c pulls $n third-party crate(s) in the default build: $(echo "$third" | tr '\n' ' ')"
              printf '%s\n' "$tree"
              fail=1
            else
              echo "$c: 0"
            fi
          done
          exit "$fail"

  # ---------------------------------- git's output is not a stable format
  git-versions:
    name: gitweb vs git ${{ matrix.git }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `gitweb` shells out to `git` and parses what comes back, so the
        # installed git is part of its contract. This caught a real regression:
        # `%aI` renders a zero UTC offset as `+00:00` up to 2.43 and as the RFC
        # 3339 `Z` after it, which silently changed the crate's public output.
        git: ['system', 'newest']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: astrx-suite }
      - name: Install a newer git
        if: matrix.git == 'newest'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq && sudo apt-get install -y git
      - run: git --version
      - run: cargo test -p gitweb --locked --all-features

  # ------------------------------------------------ the shipped installer itself
  installer:
    name: install_rust_suite.sh --ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: astrx-suite }
      # The script an operator is told to run. If it breaks, the documented
      # install path is broken, whatever the rest of this file says.
      - run: bash install_rust_suite.sh --ci

  # ------------------- the boundary between the two halves of the project
  boundary:
    name: repo boundary rules
    runs-on: ubuntu-latest
    # `docs/repository-structure.md` records why astrx-suite lives in this
    # repository rather than its own. That answer only holds while the boundary
    # is real, and it stopped being real once already: the suite's compose file
    # got extracted to the repository ROOT as well, overwriting the PHP
    # application's stack, and for several commits `docker compose up` started
    # five engines and no website. Nothing noticed. This job notices.
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
      - name: The suite depends on nothing outside itself
        run: |
          set -euo pipefail
          if grep -rn -E '\.\./\.\./src/AstrX|resources/config|/app/src' \
               astrx-suite/crates astrx-suite/deploy 2>/dev/null; then
            echo "::error::a crate reached outside astrx-suite/ — see docs/repository-structure.md rule 1"
            exit 1
          fi
          echo "ok: no crate reaches outside the suite"
      - name: The suite's compose still runs standalone
        run: |
          set -euo pipefail
          # It must not `include:` anything, or it stops being independently
          # useful — which is the whole reason a split is unnecessary.
          if grep -qE '^include:' astrx-suite/docker-compose.yml; then
            echo "::error::astrx-suite/docker-compose.yml is no longer standalone — rule 2"
            exit 1
          fi
          echo "ok: the suite deploys on its own"
      - name: The root compose composes, it does not copy
        run: |
          set -euo pipefail
          if diff -q docker-compose.yml astrx-suite/docker-compose.yml >/dev/null 2>&1; then
            echo "::error::the root compose IS the suite's again — rule 3, and this exact regression already happened once"
            exit 1
          fi
          grep -q 'astrx-suite/docker-compose.yml' docker-compose.yml \
            || { echo "::error::the root compose no longer includes the suite's"; exit 1; }
          echo "ok: one definition of the engine services, included not copied"
      - name: Every PHP Dockerfile is actually built by something
        run: |
          set -euo pipefail
          fail=0
          for d in docker/nginx/Dockerfile docker/php/Dockerfile; do
            grep -q "$d" docker-compose.yml || { echo "::error::$d is orphaned — nothing builds it"; fail=1; }
          done
          exit "$fail"

  # ------------------------------------------------------------- supply chain
  #
  # Split deliberately. `bans`, `licenses` and `sources` are decided entirely by
  # this repository's own lockfile and deny.toml, so they are reproducible and
  # they block. `advisories` reads a LIVE feed — a RUSTSEC advisory published
  # tomorrow would fail this build with no change to the tree, and blocking a
  # merge on someone else's publication schedule is how a red CI becomes
  # background noise people stop reading. It runs, it reports, it does not gate;
  # the scheduled run below is what surfaces a new advisory on a quiet day.
  deny:
    name: cargo-deny (bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: astrx-suite/Cargo.toml
          command: check bans licenses sources

  advisories:
    name: cargo-deny (advisories, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: astrx-suite/Cargo.toml
          command: check advisories
