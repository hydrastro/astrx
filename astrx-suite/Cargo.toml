# astrx-suite — Rust engine workspace. One language for the whole suite.
# Each engine is a crate; crawlcore is the shared library. Zero third-party
# dependencies by default (stdlib only), matching the suite's austere ethos:
# `crawlcore` is stdlib-only in its default build (its `net` feature adds tokio,
# for the shared async HTTP reader), and `torrentds` with its default (empty) feature
# set is too — the live node's two vetted deps (tokio, getrandom) are pulled in
# only by the opt-in `net`/`rand` features. `cargo tree --no-default-features`
# over torrentds is asserted empty in CI, so the claim stays true, not aspirational.
# The Python engines being retired live under legacy-python/ during migration.
#
# Manifests are deliberately written WITHOUT Cargo workspace-inheritance
# (`field.workspace = true`, `[workspace.dependencies]`, `[workspace.lints]`) or
# the `[lints]` table, so the whole workspace parses on Cargo as old as 1.56 and
# a toolchain below the declared `rust-version` fails with a clear MSRV message
# rather than a cryptic "feature `workspace-inheritance` is required" parse error.
# Each crate therefore repeats its `edition`/`rust-version`/`license` and declares
# its own `tokio`/`getrandom` versions; clippy's lint bar is enforced in CI via
# `cargo clippy ... -- -D warnings`, not a manifest `[lints]` table.
[workspace]
resolver = "2"
members = [
    "crates/crawlcore",
    "crates/torrentds",
    "crates/onioncrawler",
    "crates/websearch",
    "crates/gitweb",
    "crates/suitedash",
]
# `fuzz/` is a cargo-fuzz project with its own manifest; it is not a workspace
# member and is built only via `cargo +nightly fuzz`.
exclude = ["fuzz"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
