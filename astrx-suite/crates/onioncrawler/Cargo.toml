[package]
name = "onioncrawler"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/hydrastro/astrx"
description = "Darknet (.onion/.i2p) crawler: the anti-leak host gate expressed as a type, URL canonicalizer, language guess, SOCKS5 fetch, storage, no-JS search."

[dependencies]
# First-party shared crawl library (globmatch, dedup/SimHash, scheduler, traps,
# hashing incl. BLAKE2b, and the HTTP/1.1 wire layer this crate shares with
# websearch). Not a third-party dependency — the zero-dep-by-default guarantee is
# about crates.io deps; crawlcore is itself stdlib-only in its default build.
crawlcore = { path = "../crawlcore" }
# The networking tier (SOCKS5 client, HTTP fetcher, no-JS search server) lives
# behind the opt-in `net`/`rand` features and pulls in only the two vetted deps
# the rest of the suite uses. Versions are declared here (not via
# `[workspace.dependencies]`) so the manifest parses on pre-1.64 Cargo — see the
# root Cargo.toml note.
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util"], optional = true }
getrandom = { version = "0.2", optional = true }

[features]
default = []
rand = ["dep:getrandom"]
# `crawlcore/net` turns on the streaming half of the shared HTTP/1.1 wire layer
# (`crawlcore::http::perform_request`), which is where this crate's async
# `perform_request` reads a response body off a SOCKS-tunnelled socket.
net = ["dep:tokio", "rand", "crawlcore/net"]

# The `onioncrawler` command-line entrypoint (crawl / search / stats / submit /
# reseed / backup / authority / cluster / recrawl), porting the Python
# `python3 -m onioncrawler` CLI. Gated on `net` via `required-features` so
# `cargo build -p onioncrawler` (no features) stays a pure, zero-dependency
# library — the binary and its tokio use exist only under `net`.
[[bin]]
name = "onioncrawler"
path = "src/bin/onioncrawler.rs"
required-features = ["net"]
