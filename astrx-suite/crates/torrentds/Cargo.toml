[package]
name = "torrentds"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/hydrastro/astrx"
description = "DHT torrent-metadata indexer + tracker: bencode wire codec, byte-exact infohash, KRPC (BEP-5)."

# The pure wire core (bencode, infohash, krpc codec, bep33, classify, and all
# metadata *parsing*) is dependency-free and auditable on its own — it is what
# builds under the default (empty) feature set. Networking needs an async runtime
# + a CSPRNG; tokio and getrandom are the two vetted, minimal deps the live node
# uses, and they are pulled in ONLY by the opt-in features below. Their versions
# are declared here (not via `[workspace.dependencies]`) so the manifest parses
# on pre-1.64 Cargo — see the root Cargo.toml note.
[dependencies]
# First-party shared library — stdlib-only, so this does not touch the
# zero-third-party-dependency invariant. Used for the durable snapshot publish
# (`atomicfile::write_atomic`), which every engine in the suite shares so a torn
# write cannot destroy an index in any of them.
crawlcore = { path = "../crawlcore" }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util"], optional = true }
getrandom = { version = "0.2", optional = true }

# Feature tiers (each a strict superset of the one above):
#   default : nothing — the pure wire core, zero third-party deps.
#   rand    : + getrandom, for the sync CSPRNG-backed structures (routing table,
#             swarm peer store).
#   net     : + tokio (implies rand), for the live async node, trackers and the
#             metadata fetch client/server.
[features]
default = []
rand = ["dep:getrandom"]
net = ["dep:tokio", "rand"]

# The `torrentds` command-line entrypoint (index / search / tracker / stats /
# block / backup), porting the Python `python3 -m torrentds` CLI. Gated on `net`
# via `required-features` so `cargo build -p torrentds` (no features) stays a
# pure, zero-dependency library — the binary and its tokio use exist only under
# `net`.
[[bin]]
name = "torrentds"
path = "src/bin/torrentds.rs"
required-features = ["net"]
