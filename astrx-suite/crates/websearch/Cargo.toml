[package]
name = "websearch"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/hydrastro/astrx"
description = "Clearnet search engine: SSRF-safe crawler (the guard as a type), FTS + BM25/PageRank ranking, no-JS UI + JSON API, federation."

[dependencies]
# First-party shared crawl library (SimHash bit-math, scheduler, traps, hashing,
# INFLATE, and the HTTP/1.1 wire layer this crate shares with onioncrawler). Not
# a third-party dependency — the zero-dep-by-default guarantee is about crates.io
# deps; crawlcore is itself stdlib-only in its default build.
crawlcore = { path = "../crawlcore" }
# The networking tier (SSRF-checked HTTP client, crawler, no-JS server) lives
# behind the opt-in `net`/`rand` features and pulls in only the two vetted deps
# the rest of the suite uses. Declared here (not via `[workspace.dependencies]`)
# so the manifest parses on pre-1.64 Cargo — see the root Cargo.toml note.
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util"], optional = true }
getrandom = { version = "0.2", optional = true }

[features]
default = []
rand = ["dep:getrandom"]
# `crawlcore/net` turns on the streaming half of the shared HTTP/1.1 wire layer
# (`crawlcore::http::perform_request`), which is where this crate's async
# `perform_request` reads a response body off a socket.
net = ["dep:tokio", "rand", "crawlcore/net"]

# The `websearch` command-line entrypoint (crawl / serve / stats / backup),
# porting the Python `python3 -m websearch` CLI. Gated on `net` via
# `required-features` so `cargo build -p websearch` (no features) stays a pure,
# zero-dependency library — the binary and its tokio use exist only under `net`.
[[bin]]
name = "websearch"
path = "src/bin/websearch.rs"
required-features = ["net"]
