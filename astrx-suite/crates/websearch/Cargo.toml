[package]
name = "websearch"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/hydrastro/astrx"
description = "Clearnet search engine: SSRF-safe crawler (the guard as a type), FTS + BM25/PageRank ranking, no-JS UI + JSON API, federation."

[dependencies]
# First-party shared crawl library (SimHash bit-math, scheduler, traps, hashing,
# INFLATE). Not a third-party dependency — the zero-dep-by-default guarantee is
# about crates.io deps; crawlcore is itself stdlib-only.
crawlcore = { path = "../crawlcore" }
# The networking tier (SSRF-checked HTTP client, crawler, no-JS server) lives
# behind the opt-in `net`/`rand` features and pulls in only the two vetted deps
# the rest of the suite uses. Declared here (not via `[workspace.dependencies]`)
# so the manifest parses on pre-1.64 Cargo — see the root Cargo.toml note.
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util"], optional = true }
getrandom = { version = "0.2", optional = true }

[features]
default = []
rand = ["dep:getrandom"]
net = ["dep:tokio", "rand"]
