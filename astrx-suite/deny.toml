# ─────────────────────────────────────────────────────────────────────────────
# cargo-deny configuration for the astrx-suite Rust workspace.
#
#   cargo deny check                 # run all checks below
#   cargo deny check advisories      # just the RustSec audit
#   cargo deny check bans licenses   # just the supply-chain / licence gates
#
# This is the supply-chain complement to the CI in .github/workflows/astrx-suite.yml:
# CI proves the *default* build is dependency-free, while cargo-deny governs the
# handful of vetted crates the opt-in `rand` / `net` features are allowed to add
# (tokio + getrandom and their small transitive closure). Run it on the full
# feature surface so those deps are actually in the graph being audited.
# ─────────────────────────────────────────────────────────────────────────────

[graph]
# Audit the whole dependency surface, not just the (empty) default build —
# otherwise there would be nothing to check, since `default = []` is stdlib-only.
all-features = true

# ── Security advisories (RustSec) ────────────────────────────────────────────
# Vulnerabilities and unsound advisories are always errors under `version = 2`
# (silence a specific one, with justification, by adding its RUSTSEC id to
# `ignore`). We additionally treat unmaintained crates and yanked releases as
# hard failures — a tiny dependency set is only worth it if every crate in it is
# alive and pinned to a published, non-withdrawn version.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = [
  # "RUSTSEC-0000-0000",  # <justification, owner, review date>
]

# ── Licences ─────────────────────────────────────────────────────────────────
# Permissive-only, and exactly the four licences the closure actually contains:
# MIT / Apache-2.0 for the dual-licensed crates, Unicode-3.0 for `unicode-ident`,
# the LLVM-exception Apache variant for `wasi`. Nothing else.
#
# This list used to also carry ISC, BSD-2-Clause, BSD-3-Clause, Zlib and 0BSD,
# on the theory that a future vetted dependency under one of them should not
# need a config change. cargo-deny reports every allowance it never matches, so
# that theory cost five `license-not-encountered` warnings on every single run —
# and a check that always prints warnings is a check people stop reading.
#
# The theory was backwards anyway. Admitting a new licence to a project whose
# entire runtime closure is two crates should be a deliberate, reviewed act,
# exactly like admitting a new crate. Copyleft (GPL/LGPL/MPL/AGPL) is absent for
# that reason; permissive-but-unused licences deserve the same treatment. A
# dependency under ISC now fails here, names the licence, and asks a human —
# which is the point.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
]
exceptions = [
  # { name = "some-crate", allow = ["SomeOtherLicense"] },
]

# ── Bans — keep the dependency set tiny and single-versioned ─────────────────
# The design intent: the pure wire core has ZERO third-party deps, and the live
# node adds only two vetted crates. As of today the *entire* allowed runtime
# closure (under --all-features) is:
#
#     tokio            — async runtime          (net feature)
#     getrandom        — CSPRNG                 (rand feature)
#     └─ transitively:  libc, mio, socket2, bytes, pin-project-lite, cfg-if,
#                       wasi, windows-sys/windows-link (platform shims), and the
#                       build-time proc-macro trio proc-macro2 / quote / syn
#                       (+ tokio-macros, unicode-ident).
#
# `multiple-versions` + `wildcards` keep that closure lean and honest; the
# `deny` list below pre-empts the heavy crates we never intend to pull in, so
# any attempt to add TLS/crypto stacks or an in-process libgit2 (gitweb is
# argv-only git by design) fails loudly in review rather than silently bloating
# the tree.
[bans]
multiple-versions = "deny"
wildcards = "deny"

# `wildcards` exists to stop `foo = "*"` against a REGISTRY crate, where it means
# "whatever crates.io serves today" and hands a third party the version choice.
# It also counts a path dependency with no `version` field, because that is a
# wildcard by the letter of the rule — and every crate here depends on crawlcore
# as `{ path = "../crawlcore" }`, so the check failed on the workspace's own
# internal wiring:
#
#     error[wildcard]: found 1 wildcard dependency for crate 'websearch'
#       crawlcore = { path = "../crawlcore" }
#
# That is not the hazard the rule is for. A path dependency resolves to the
# source sitting in this repository at this commit; there is no registry and no
# third party in the loop. The alternative — writing `version = "0.1.0"`
# alongside every path — buys nothing (these crates are not published) and adds a
# line to edit in six manifests on every version bump.
#
# So path wildcards are exempt and registry wildcards are not, which is the
# distinction the rule was always trying to draw.
allow-wildcard-paths = true

# Prefer the workspace-declared version of any crate that also appears deeper.
highlight = "all"

deny = [
  # Heavy TLS / crypto stacks — the suite runs behind Tor and needs none of them.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "ring" },
  # In-process git — gitweb shells out to the git binary (argv-only) by design.
  { name = "git2" },
  { name = "libgit2-sys" },
]

# A hard allowlist is intentionally NOT enabled: turning `allow` on would make it
# exhaustive, so it would also have to enumerate every build-time proc-macro and
# per-platform shim above, and would churn on each toolchain bump. The intent is
# documented here and enforced structurally instead — the pure-core zero-dep gate
# in CI, plus `multiple-versions`/`wildcards`/`deny` — which together keep the set
# tiny without the maintenance cost. Uncomment and complete to make it strict:
# allow = [
#   { name = "tokio" },
#   { name = "getrandom" },
#   { name = "libc" },
#   { name = "mio" },
#   { name = "socket2" },
#   { name = "bytes" },
#   { name = "pin-project-lite" },
#   { name = "cfg-if" },
#   # ...plus wasi, windows-sys, windows-link, proc-macro2, quote, syn,
#   #    tokio-macros, unicode-ident.
# ]

# ── Sources — only the official crates.io registry ───────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
