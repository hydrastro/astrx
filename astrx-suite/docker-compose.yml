# astrx-suite — one-command Tor deployment.
#
#   cp deploy/.env.example .env      # optional: profiles / image tag
#   docker compose up -d             # builds + starts the published stack
#   docker compose exec tor sh -c 'cat /var/lib/tor/*/hostname'   # your .onions
#
# PRIVACY POSTURE
#   * No app port is published to the host — there is NO `ports:` mapping
#     anywhere below.  The only ingress is Tor, which reaches each service over
#     an INTERNAL Docker network that has no route to the host or the internet.
#   * `tor` is dual-homed: the `internal` network (to reach the app containers
#     and to offer SOCKS to the crawler) and the `egress` network (so Tor — and
#     only Tor and the opt-in clearnet crawlers — can reach the outside world).
#   * Each stateful service keeps its SQLite DB / repos in a named volume, and
#     Tor keeps its hidden-service keys in `tor-keys`, so the generated .onion
#     addresses are STABLE across restarts.
#
# Build contexts are each tool's Wave-1 directory (./gitweb, ./onioncrawler, …)
# and every app image is zero-dependency pure Python, so a build is just a file
# copy once the python:3.11-slim base is present locally.

name: astrx-suite

# --- shared config for the always-on, published app services ---------------
x-app-published: &app-published
  restart: unless-stopped
  networks: [internal]
  # Hardening: these are static-uid pure-Python HTTP servers; they need no
  # Linux capabilities and must never gain privileges.
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

networks:
  # No route to the host or the internet.  App services live here; Tor bridges
  # them to the outside.  Docker's embedded DNS still resolves service names.
  # Fixed subnet so Tor's SocksPolicy (deploy/torrc) can allow ONLY this network
  # to use SOCKS and reject the egress bridge + host.  Keep the two in sync.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 10.63.0.0/24
  # Outbound-only bridge for Tor's own traffic and the opt-in clearnet crawlers.
  egress:
    driver: bridge

volumes:
  gitweb-repos:        # git repositories served read-only by gitweb
  onioncrawler-data:   # onioncrawler crawl.db (+ seeds/blocklists)
  websearch-data:      # websearch web.db (+ seeds)
  torrentds-data:      # torrentds torrentds.db (+ tracker peers.json)
  tor-keys:            # /var/lib/tor — hidden-service keys => STABLE .onions

services:
  # ------------------------------------------------------------------ gitweb
  gitweb:
    <<: *app-published
    build:
      context: ./gitweb
    image: astrx/gitweb:${IMAGE_TAG:-latest}
    # Task-specified invocation: `python3 -m gitweb --root /repos ...`.
    entrypoint: ["python3", "-m", "gitweb"]
    command: ["--root", "/repos", "--host", "0.0.0.0", "--port", "8801", "--quiet"]
    volumes:
      - gitweb-repos:/repos
    expose: ["8801"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8801/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------- onioncrawler (search UI)
  onioncrawler-search:
    <<: *app-published
    build:
      context: ./onioncrawler
    image: astrx/onioncrawler:${IMAGE_TAG:-latest}
    command: ["search", "--db", "/data/crawl.db", "--host", "0.0.0.0", "--port", "8802"]
    volumes:
      - onioncrawler-data:/data
    expose: ["8802"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8802/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------- onioncrawler (resumable crawler; opt)
  # One-off / batch worker.  Egress is via Tor's SOCKS on the internal network
  # (--tor-host tor); it never talks to the internet directly.
  #   docker compose run --rm onioncrawler-crawl \
  #       crawl --db /data/crawl.db --seed http://example.onion --tor-host tor -v
  onioncrawler-crawl:
    profiles: ["crawl"]
    build:
      context: ./onioncrawler
    image: astrx/onioncrawler:${IMAGE_TAG:-latest}
    command: ["crawl", "--db", "/data/crawl.db", "--seeds", "/data/seeds.txt",
              "--fetcher", "tor", "--tor-host", "tor", "--tor-port", "9050", "-v"]
    volumes:
      - onioncrawler-data:/data
    networks: [internal]
    depends_on:
      tor:
        condition: service_started
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ------------------------------------------------- websearch (clear-web UI)
  websearch-serve:
    <<: *app-published
    build:
      context: ./websearch
    image: astrx/websearch:${IMAGE_TAG:-latest}
    command: ["serve", "--db", "/var/lib/websearch/web.db", "--host", "0.0.0.0", "--port", "8803"]
    volumes:
      - websearch-data:/var/lib/websearch
    expose: ["8803"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8803/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------- websearch (clear-web crawl; opt)
  # Crawls the CLEARNET directly, so it sits on the egress network.
  #   docker compose run --rm websearch-crawl \
  #       crawl --db /var/lib/websearch/web.db --scope-domain example.com https://example.com
  websearch-crawl:
    profiles: ["crawl"]
    build:
      context: ./websearch
    image: astrx/websearch:${IMAGE_TAG:-latest}
    command: ["crawl", "--seeds", "/var/lib/websearch/seeds", "--db", "/var/lib/websearch/web.db"]
    volumes:
      - websearch-data:/var/lib/websearch
    networks: [egress]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # ---------------------------------------------- torrentds (search UI)
  torrentds-search:
    <<: *app-published
    build:
      context: ./torrentds
    image: astrx/torrentds:${IMAGE_TAG:-latest}
    command: ["search", "--db", "/data/torrentds.db", "--host", "0.0.0.0", "--port", "8804"]
    volumes:
      - torrentds-data:/data
    expose: ["8804"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8804/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------- torrentds (HTTP+UDP tracker)
  # NOTE: v3 onion services are TCP-only, so only the HTTP tracker (8805) is
  # published as an onion.  The UDP tracker (6969) has no host port and is not
  # reachable over Tor — it is here for completeness / internal use.
  torrentds-tracker:
    <<: *app-published
    build:
      context: ./torrentds
    image: astrx/torrentds:${IMAGE_TAG:-latest}
    command: ["tracker", "--db", "/data/torrentds.db", "--host", "0.0.0.0",
              "--http-port", "8805", "--udp-port", "6969", "--peers-db", "/data/peers.json"]
    volumes:
      - torrentds-data:/data
    expose: ["8805", "6969/udp"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8805/',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------- torrentds (DHT harvester; opt)
  # Long-running; harvests the CLEARNET Mainline DHT, so it sits on egress and
  # shares the torrentds-data volume with search/tracker.
  torrentds-index:
    profiles: ["index"]
    build:
      context: ./torrentds
    image: astrx/torrentds:${IMAGE_TAG:-latest}
    command: ["index", "--db", "/data/torrentds.db", "--host", "0.0.0.0", "--port", "6881"]
    volumes:
      - torrentds-data:/data
    networks: [egress]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # --------------------------------------------------------------- suitedash
  suitedash:
    <<: *app-published
    build:
      context: ./suitedash
    image: astrx/suitedash:${IMAGE_TAG:-latest}
    # Retarget the four default cards at the container hostnames (keeps each
    # card's curated health/metrics paths).
    command: ["--host", "0.0.0.0", "--port", "8805", "--quiet",
              "--service", "gitweb=http://gitweb:8801",
              "--service", "onioncrawler=http://onioncrawler-search:8802",
              "--service", "websearch=http://websearch-serve:8803",
              "--service", "torrentds=http://torrentds-search:8804"]
    expose: ["8805"]
    depends_on:
      gitweb:              {condition: service_healthy}
      onioncrawler-search: {condition: service_healthy}
      websearch-serve:     {condition: service_healthy}
      torrentds-search:    {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8805/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------------- tor
  # The single ingress.  Builds a tiny image (same python:3.11-slim base as the
  # apps + the Debian `tor` package) that publishes one v3 onion per surface and
  # offers SOCKS to the crawler.  Starts as root only to fix the key-volume
  # ownership, then Tor setuids to debian-tor (see deploy/torrc `User`).
  tor:
    build:
      context: ./deploy
      dockerfile: Dockerfile.tor
    image: astrx/tor:${IMAGE_TAG:-latest}
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - tor-keys:/var/lib/tor
    networks: [internal, egress]
    restart: unless-stopped
    depends_on:
      gitweb:              {condition: service_healthy}
      onioncrawler-search: {condition: service_healthy}
      websearch-serve:     {condition: service_healthy}
      torrentds-search:    {condition: service_healthy}
      torrentds-tracker:   {condition: service_healthy}
      suitedash:           {condition: service_healthy}
