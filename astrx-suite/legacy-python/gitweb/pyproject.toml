[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitweb"
version = "1.0.0"
description = "Read-only, no-JavaScript web git browser (Python standard library only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "astrx" }]
keywords = ["git", "web", "viewer", "tor", "read-only", "no-javascript"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Version Control :: Git",
]
# Zero runtime dependencies: the whole viewer runs on the standard library.
dependencies = []

[project.optional-dependencies]
# Purely optional: enables syntax highlighting (behind --highlight).  Without
# it the numbered-lines renderer falls back to escaped plaintext.
highlight = ["Pygments>=2.0"]

[project.scripts]
gitweb = "gitweb.__main__:main"

[tool.setuptools]
packages = ["gitweb"]

[tool.setuptools.package-data]
gitweb = ["py.typed"]
