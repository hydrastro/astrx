[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torrentds"
version = "1.0.0"
description = "Zero-dependency DHT torrent-metadata search engine + BitTorrent tracker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "torrentds" }]
keywords = ["bittorrent", "dht", "magnet", "tracker", "search", "bep-51"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: File Sharing",
    "Operating System :: POSIX :: Linux",
]
# Intentionally zero runtime dependencies: Python 3.11 standard library only.
dependencies = []

[project.urls]
Homepage = "https://example.invalid/torrentds"

[project.scripts]
torrentds = "torrentds.cli:main"

[tool.setuptools]
packages = ["torrentds"]

[tool.setuptools.package-data]
torrentds = ["py.typed"]
