[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onioncrawler"
version = "1.1.0"
description = "Resumable, trap-resistant crawler + no-JS search engine for Tor hidden services (.onion), Python 3.11 stdlib only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "astrx-suite" }]
keywords = ["tor", "onion", "crawler", "search", "fts5", "privacy"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Environment :: No Input/Output (Daemon)",
]
# Zero third-party dependencies: standard library only.
dependencies = []

[project.urls]
Homepage = "https://example.invalid/onioncrawler"
Source = "https://example.invalid/onioncrawler"

[project.scripts]
onioncrawler = "onioncrawler.__main__:main"

[tool.setuptools]
packages = ["onioncrawler"]

[tool.setuptools.package-data]
onioncrawler = []
