version: '3'

services:
    nginx:
        tty: true
        restart: always
        container_name: container.nginx
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        ports:
            - "80:80"
        volumes:
            - ./public:/app/public
            - ./src:/app/src
            - ./resources:/app/resources
            - ./build:/app/build
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - php-network
        depends_on:
          - phpfpm
    phpfpm:
      tty: true
      restart: always
      container_name: container.phpfpm
      build:
        context: .
        dockerfile: docker/php/Dockerfile
      volumes:
        - ./public:/app/public
        - ./src:/app/src
        - ./resources:/app/resources
        - ./build:/app/build
      networks:
        - php-network
    mariadb:
        tty: true
        restart: always
        container_name: container.mariadb
        image: mariadb
        # DB stays on the internal compose network; do NOT publish it to the host
        # (needless attack surface on a hidden-service box). Uncomment only for
        # local debugging, never in production.
        # ports:
        #     - '3306:3306'
        volumes:
            - './src/setup/init.sql:/docker-entrypoint-initdb.d/init.sql'
            #- './docker/mysql/dbdata:/var/lib/mysql'
        networks:
            - php-network
        environment:
            MARIADB_ROOT_PASSWORD_HASH: "*2470C0C06DEE42FD1618BB99005ADCA2EC9D1E19"
            MYSQL_DATABASE: content_manager

networks:
  php-network:
    driver: bridge
