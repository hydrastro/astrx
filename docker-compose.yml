version: '3'

services:
    nginx:
        tty: true
        restart: always
        container_name: container.nginx
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        ports:
            # R4-18: bind to loopback only so the onion content is reachable by
            # the host's local tor daemon / reverse proxy but NOT published on the
            # host's clearnet interfaces (plain "80:80" listens on 0.0.0.0).
            - "127.0.0.1:80:80"
        volumes:
            - ./public:/app/public
            - ./src:/app/src
            - ./resources:/app/resources
            - ./build:/app/build
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - php-network
        depends_on:
          - phpfpm
    phpfpm:
      tty: true
      restart: always
      container_name: container.phpfpm
      build:
        context: .
        dockerfile: docker/php/Dockerfile
      volumes:
        - ./public:/app/public
        - ./src:/app/src
        - ./resources:/app/resources
        - ./build:/app/build
        # tools/ holds the CLI entry points (e.g. the search crawler). Without
        # this mount /app/tools does not exist in the container, so both
        # `php /app/tools/search_index.php` AND the admin "Rebuild now" button
        # (which exec()s that same path) fail — the job then wedges in 'running'.
        - ./tools:/app/tools
      networks:
        - php-network
    mariadb:
        tty: true
        restart: always
        container_name: container.mariadb
        image: mariadb
        # DB stays on the internal compose network; do NOT publish it to the host
        # (needless attack surface on a hidden-service box). Uncomment only for
        # local debugging, never in production.
        # ports:
        #     - '3306:3306'
        volumes:
            - './src/setup/init.sql:/docker-entrypoint-initdb.d/init.sql'
            #- './docker/mysql/dbdata:/var/lib/mysql'
        networks:
            - php-network
        environment:
            # R4-17: no default weak secret in the repo. The committed value used
            # to be the MariaDB hash of 'password'. Provide the hash via .env
            # (MARIADB_ROOT_PASSWORD_HASH=...); compose fails fast if it is unset.
            MARIADB_ROOT_PASSWORD_HASH: "${MARIADB_ROOT_PASSWORD_HASH:?set MARIADB_ROOT_PASSWORD_HASH in .env}"
            MYSQL_DATABASE: content_manager

networks:
  php-network:
    driver: bridge
