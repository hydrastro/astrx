# AstrX — the whole project, one command.
#
#   cp .env.example .env      # set the database secrets (compose fails without)
#   docker compose up -d      # PHP app + all five Rust engines + Tor
#
# This file was, until recently, ONLY the Rust suite's stack. Commit 15f8436
# landed `astrx-suite/docker-compose.yml` at the repository root as well as in
# its own directory, overwriting the PHP application's compose file — so
# `docker/nginx/Dockerfile`, `docker/php/Dockerfile` and `docker/mysql/Dockerfile`
# had nothing building them at all, and `docker compose up` in a fresh clone
# brought up the engines and no website. Nothing caught it because nothing tests
# the deployment. This file restores the application stack and *composes* the two
# rather than one clobbering the other.
#
# THE TWO STACKS
#   The Rust engines keep their own self-contained deployment at
#   `astrx-suite/docker-compose.yml`, which still works standalone
#   (`cd astrx-suite && docker compose up -d`) — that is the right thing to run
#   if you want the engines without the CMS. This file `include:`s it, so there
#   is exactly one definition of those services and no copy to drift.
#
# HOW THEY REACH EACH OTHER
#   The suite's `internal` network deliberately has no route to the host or the
#   internet; the engines publish NO ports. `phpfpm` therefore joins that network
#   directly and addresses each engine by its service name, which is both simpler
#   and safer than punching ports through to the host:
#
#       gitweb:8801  onioncrawler-search:8802  websearch-serve:8803
#       torrentds-search:8804  suitedash:8806
#
#   Point the bridge configs at those names — `resources/config/GitBrowse.config.php`,
#   `SuiteDash.config.php`, `WebSearch.config.php`, `OnionSearch.config.php`,
#   `TorrentSearch.config.php` — instead of `127.0.0.1:88xx`, which is only
#   correct when you run the engines directly on the host. See
#   `docs/suite-search-modules.md`.

name: astrx

# One definition of the engine services, pulled in rather than copied. Requires
# Docker Compose >= 2.20; if yours is older, run the two stacks separately as
# described above.
include:
  - path: astrx-suite/docker-compose.yml

services:
  # ------------------------------------------------------------------ nginx --
  nginx:
    tty: true
    restart: unless-stopped
    container_name: astrx.nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      # Loopback only, so the site is reachable by the host's tor daemon or a
      # local reverse proxy but NOT published on the host's clearnet
      # interfaces — a plain "80:80" listens on 0.0.0.0.
      - "127.0.0.1:80:80"
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./resources:/app/resources
      - ./build:/app/build
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [php-network]
    depends_on: [phpfpm]

  # ----------------------------------------------------------------- php-fpm --
  phpfpm:
    tty: true
    restart: unless-stopped
    container_name: astrx.phpfpm
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./resources:/app/resources
      - ./build:/app/build
      # tools/ holds the CLI entry points (e.g. the search crawler). Without
      # this mount /app/tools does not exist in the container, so both
      # `php /app/tools/search_index.php` AND the admin "Rebuild now" button
      # (which exec()s that same path) fail — the job then wedges in 'running'.
      - ./tools:/app/tools
    networks:
      - php-network
      # The suite's no-egress network, so the CMS bridge pages can reach the
      # engines by service name without any engine publishing a port.
      - internal

  # ---------------------------------------------------------------- mariadb --
  mariadb:
    tty: true
    restart: unless-stopped
    container_name: astrx.mariadb
    image: mariadb
    # The database stays on the internal compose network; do NOT publish it to
    # the host — needless attack surface on a hidden-service box. Uncomment only
    # for local debugging, never in production.
    # ports:
    #   - '3306:3306'
    volumes:
      - ./src/setup/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb-data:/var/lib/mysql
    networks: [php-network]
    environment:
      # No default weak secret in the repo — the committed value here used to be
      # the MariaDB hash of 'password'. Supply it via .env; compose fails fast if
      # it is unset rather than starting with something guessable.
      MARIADB_ROOT_PASSWORD_HASH: "${MARIADB_ROOT_PASSWORD_HASH:?set MARIADB_ROOT_PASSWORD_HASH in .env}"
      # The application account is provisioned through the official MariaDB
      # entrypoint rather than a hardcoded CREATE USER / GRANT ALL in init.sql,
      # so it is granted rights on THAT database only — no wildcard ALL
      # PRIVILEGES on *.*. NB: the running app reads its own
      # resources/config/PDO.config.php; keep its db_name/db_username/db_password
      # in sync with these values.
      MARIADB_DATABASE: "${DB_NAME:-content_manager}"
      MARIADB_USER: "${DB_USER:?set DB_USER in .env}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?set a strong DB_PASSWORD in .env}"

networks:
  php-network:
    driver: bridge
  # `internal` itself is defined by the included suite compose (internal: true,
  # pinned subnet); naming it here only joins it.

volumes:
  # The database used to live in an unmounted container layer, so `docker
  # compose down -v` silently destroyed every board, page and account. It now
  # has a named volume like every other stateful service in the project.
  mariadb-data:
