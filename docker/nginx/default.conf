# Default server configuration
#
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	error_log /tmp/error;
	autoindex off;
	server_tokens off;

	# Allow image uploads comfortably above the imageboard's ~4 MB cap so a
	# normal upload never trips nginx's 1 MB default and returns 413.
	client_max_body_size 16m;

	# Serve our own branded page for nginx-level errors (request too large,
	# gateway/timeout) instead of the stock nginx error pages.
	error_page 413 500 502 503 504 /error.html;


	# SSL configuration
	#
	# listen 443 ssl default_server;
	# listen [::]:443 ssl default_server;
	#
	# Note: You should disable gzip for SSL traffic.
	# See: https://bugs.debian.org/773332
	#
	# Read up on ssl_ciphers to ensure a secure configuration.
	# See: https://bugs.debian.org/765782
	#
	# Self signed certs generated by the ssl-cert package
	# Don't use them in a production server!
	#
	# include snippets/snakeoil.conf;

	root /app/public;
	# Add index.php to the list if you are using PHP
	index index.php index.html index.htm index.nginx-debian.html;

	#server_name _;

	# Compiled benchmark prefix. Requests under /compile are handled by
	# public/compile/index.php, which strips the prefix before routing and
	# rewrites internal links back under /compile.
	location = /compile {
		rewrite ^ /compile/index.php last;
	}

	# `^~` beats the regex PHP location below, so anything served from here is
	# served as a STATIC FILE. With `try_files $uri`, a second .php file added
	# under public/compile/ would be handed to the client as plain source —
	# readable config, credentials, whatever it contains. Only index.php exists
	# today; route everything under the prefix straight to it instead of probing
	# the filesystem first, so adding a file cannot change that.
	location ^~ /compile/ {
		rewrite ^ /compile/index.php last;
	}

	# Exact PHP handler for the compiled benchmark front controller.
	# This is needed because ^~ /compile/ would otherwise beat the generic
	# PHP regex location and /compile/index.php would never reach PHP-FPM.
	location = /compile/index.php {
		fastcgi_pass phpfpm:9000;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_index index.php;
		include fastcgi_params;
	}

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ /index.php$is_args$args; #=404
	}

	# Branded error page for the error_page directive above. Marked internal so
	# it can only be reached via an internal error redirect, never requested directly.
	location = /error.html {
		internal;
		root /app/public;
	}

	# pass PHP scripts to FastCGI server
	#
	#location ~ \.php$ {
	#	include snippets/fastcgi-php.conf;
	#
	#	# With php-fpm (or other unix sockets):
	#	fastcgi_pass unix:/run/php/php7.3-fpm.sock;
	#	# With php-cgi (or other tcp sockets):
	#	fastcgi_pass 127.0.0.1:9000;
	#}

	# `\.php`, not `.php`: an unescaped dot in an nginx regex matches ANY
	# character, so `location ~ [^/].php(/|$)` also matched /x/fooXphp and
	# /appphp — every such URI was handed to PHP-FPM. FPM's
	# security.limit_extensions answers 403 rather than executing them, so this
	# was reachability, not RCE; the point is that the set of URIs that reach
	# FPM at all should be the set that ends in .php. Same escape in
	# fastcgi_split_path_info, which otherwise splits SCRIPT_FILENAME at the
	# wrong offset for a path like /a.phpx/b.
	location ~ [^/]\.php(/|$) {
		fastcgi_split_path_info ^(.+?\.php)(/.*)$;
		fastcgi_pass phpfpm:9000;
		#fastcgi_pass unix:/var/run/php/php-fpm.sock;
		fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
		fastcgi_index index.php;
		include fastcgi_params;
	}

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#	deny all;
	#}
}


