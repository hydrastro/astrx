<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>{{site}}</title></head>
<body>
<h1>{{heading}}</h1>
<p id="greeting">{{greeting}}</p>

    <input id="name" name="name" type="text">

<ul>

{{/features}}
</ul>
</body>
</html>
