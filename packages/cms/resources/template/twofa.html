<h2>{{twofa_heading}}</h2>
<p>{{twofa_intro}}</p>
<form method="POST">
    <input type="hidden" name="prg_id" value="{{prg_id}}">
    <input type="hidden" name="_csrf"  value="{{csrf_token}}">
    <p>
        <label for="code">{{label_code}}:</label>
        <input type="text" name="code" id="code" class="input" autocomplete="off" inputmode="numeric">
    </p>
    <p><small>{{twofa_hint}}</small></p>
    <p><input type="submit" value="{{btn_verify}}" class="input"></p>
</form>
