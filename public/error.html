<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #fff;
                     font-family: 'Times New Roman', Times, serif; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 2em 1em; }
        .box  { border: 4px solid #fff; border-bottom-width: 0; padding: 1.5em; }
        h1    { margin: .2em 0 .5em; font-size: 1.6em; }
        p     { line-height: 1.5; }
        a     { color: #fff; }
        .muted{ opacity: .7; font-size: .9em; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="box">
        <h1>Something went wrong</h1>
        <p>The server couldn't complete your request. If you were uploading a file,
           it may have been larger than the server allows.</p>
        <p class="muted">Please go back and try again, or return to the
           <a href="/">home page</a>.</p>
    </div>
</div>
</body>
</html>
