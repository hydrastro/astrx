<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{site_name}} — Verify your account</title>
</head>
<body style="font-family:sans-serif;max-width:600px;margin:0 auto;padding:24px;color:#222;background:#fff">
  <h2 style="margin:0 0 16px;font-size:20px">Welcome to {{site_name}}, {{username}}</h2>
  <p>Thanks for registering. To finish setting up your account, click the link below:</p>
  <p style="margin:24px 0">
    <a href="{{link}}" style="display:inline-block;padding:10px 20px;background:#2a6ed4;color:#fff;text-decoration:none;border-radius:4px">
      Verify my account
    </a>
  </p>
  <p style="font-size:13px;color:#666">Or paste this URL into your browser:</p>
  <p style="font-size:13px;color:#666;word-break:break-all">{{link}}</p>
  <hr style="border:none;border-top:1px solid #ddd;margin:32px 0">
  <p style="font-size:12px;color:#999">
    If you did not create an account at {{site_name}}, you can safely ignore this email.
  </p>
</body>
</html>
