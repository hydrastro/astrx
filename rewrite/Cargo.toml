# astrx-suite — Rust rewrite workspace. One language for the whole suite.
# Each engine becomes a crate here; crawlcore is the shared library. Zero
# third-party dependencies by default (stdlib only), matching the suite's ethos.
[workspace]
resolver = "2"
members = ["crates/crawlcore"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = true
strip = true
